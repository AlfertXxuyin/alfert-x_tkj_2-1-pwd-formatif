<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nomor 2.3 - Formulir Kontak</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        background-color: #f8fafc;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      #contact {
        width: 100%;
        padding: 40px 20px;
      }

      .contact-form {
        width: 400px;
        margin: 0 auto;
        padding: 24px;
        border: 1px solid #cbd5e1;
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .contact-form h2 {
        text-align: center;
        font-size: 22px;
        color: #1e293b;
        margin-bottom: 24px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
        font-size: 14px;
        color: #475569;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #94a3b8;
        outline: none;
        font-size: 14px;
        transition: all 0.2s ease-in-out;

        border-radius: 6px;
      }

      .form-group textarea {
        height: 100px;
        resize: none;
      }
      .form-group input:focus,
      .form-group textarea:focus {
        background-color: #f0fdf4;
      }

      .form-group input:focus {
        border-color: #22c55e;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
      }

      .form-group textarea:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      }

      .btn-submit {
        background-color: #1e293b;
        color: #ffffff;
        border-radius: 6px;
        border: none;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: all 0.2s;
      }

      .btn-submit:hover {
        background-color: #334155;
      }
      footer {
        text-align: center;
        margin-top: 24px;
      }

      footer a {
        color: #64748b;
        font-size: 14px;
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <section id="contact">
      <form class="contact-form" action="#" method="POST">
        <h2>Hubungi Saya</h2>

        <div class="form-group">
          <!-- Atribut for dan id terhubung secara sinkron -->
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama" required />
        </div>

        <div class="form-group">
          <!-- Atribut for dan id terhubung secara sinkron -->
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <!-- Atribut for dan id terhubung secara sinkron -->
          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>

      <footer>
        <a href="../index.html">Kembali ke Beranda</a>
      </footer>
    </section>
  </body>
</html>
