<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nomor 3.1 - Menu Navigasi (Navbar) Hitam Rata Tengah</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0b0c10;
        color: #c5c6c7;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #main-header {
        background-color: #1f2833;
        width: 100%;
        border-bottom: 1px solid #2f3b4c;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      #main-header > .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
        padding: 15px 20px;
      }

      .navbar > .logo {
        color: #66fcf1;
        font-size: 20px;
        font-weight: 750;
        letter-spacing: 0.5px;
      }

      .navbar > .nav-menu {
        display: flex;
        list-style: none;
        gap: 24px;
      }

      .nav-menu > li > a {
        color: #c5c6c7;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.25s ease;
      }

      .nav-menu > li > a:hover {
        color: #66fcf1;
        text-shadow: 0 0 8px rgba(102, 252, 241, 0.5);
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      main > h2 {
        font-size: 36px;
        color: #ffffff;
        margin-bottom: 15px;
        letter-spacing: 0.5px;
      }

      main > p {
        color: #a9b2c3;
        font-size: 16px;
        max-width: 600px;
        margin-bottom: 35px;
      }

      footer {
        text-align: center;
        padding-bottom: 40px;
      }

      footer > .btn-back {
        color: #66fcf1;
        font-size: 15px;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s;
      }

      footer > .btn-back:hover {
        text-decoration: underline;
        text-shadow: 0 0 8px rgba(102, 252, 241, 0.5);
      }
    </style>
  </head>
  <body>
    <header id="main-header">
      <nav class="navbar">
        <div class="logo">Alfert.dev</div>
        <ul class="nav-menu">
          <li><a href="#">Beranda</a></li>
          <li><a href="#">Tentang</a></li>
          <li><a href="#">Proyek</a></li>
          <li><a href="#">Kontak</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Selamat Datang</h2>
      <p
        style="
          color: #94a3b8;
          font-size: 15px;
          max-width: 500px;
          margin-top: 10px;
        "
      >
        Isi halaman contoh. Bagian ini hanya pengisi agar tampilan terlihat
        seperti halaman website sungguhan.
      </p>

      <footer style="padding: 0">
        <a href="../index.html" class="btn-back">← Kembali ke Beranda</a>
      </footer>
    </main>
  </body>
</html>
