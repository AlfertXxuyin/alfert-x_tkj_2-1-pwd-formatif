<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nomor 2.1 - Kartu Proyek</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        background-color: #f4f6f9;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      main {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        width: 320px;
        padding: 20px;
        border: 2px solid #1d2d50;
        background-color: #ffffff;

        border-radius: 12px;
        margin: 30px auto 35px auto;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }

      .card img {
        width: 100%;
        height: 160px;
        display: block;
        object-fit: cover;
        border-radius: 6px;
      }

      .card h3 {
        color: #1d2d50;
        margin-top: 15px;
        margin-bottom: 8px;
        font-size: 18px;
        font-weight: 700;
      }

      .card p {
        font-size: 15px;
        color: #555555;
        line-height: 1.5;
        margin-bottom: 15px;
      }

      .card a {
        font-size: 15px;
        color: #e28743;
        text-decoration: none;
        font-weight: 600;
      }

      .card a:hover {
        text-decoration: underline;
      }

      footer {
        text-align: center;
        margin-top: 10px;
      }

      footer a {
        color: #6f42c1;
        font-size: 14px;
        text-decoration: underline;
      }

      footer a:hover {
        color: #522e94;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="../assets/images/Photo.jpg" alt="Foto Proyek Saya" />
        <h3>Website Toko Online</h3>
        <p>
          Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan
          CSS.
        </p>
        <a href="#">Lihat Proyek</a>
      </div>
    </main>

    <footer>
      <a href="../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
